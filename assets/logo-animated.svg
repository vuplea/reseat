<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="reseat animated logo: a session dropping through a socket, changing color at the seam">
  <style>
    @keyframes tri-drop {
      0%, 10%  { transform: translate(64px, 28px); opacity: 1; }
      48%, 78% { transform: translate(64px, 96px); opacity: 1; }
      92%      { transform: translate(64px, 96px); opacity: 0; }
      93%      { transform: translate(64px, 28px); opacity: 0; }
      100%     { transform: translate(64px, 28px); opacity: 1; }
    }
    @keyframes seam-pulse {
      0%, 18% { opacity: 0; } 30% { opacity: 0.9; } 46%, 100% { opacity: 0.12; }
    }
    .tri { animation: tri-drop 4.2s cubic-bezier(.55, 0, .35, 1) infinite; }
    .seam { animation: seam-pulse 4.2s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .tri { animation: none; transform: translate(64px, 61px); }
      .seam { animation: none; opacity: 0.45; }
    }
  </style>
  <defs>
    <clipPath id="above"><rect x="0" y="0" width="128" height="54"/></clipPath>
    <clipPath id="below"><rect x="0" y="68" width="128" height="60"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0B1220"/>
  <g clip-path="url(#above)">
    <path class="tri" d="M-30 -20 H30 L0 22 Z" fill="#FFB020" stroke="#FFB020" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <g clip-path="url(#below)">
    <path class="tri" d="M-30 -20 H30 L0 22 Z" fill="#22D3EE" stroke="#22D3EE" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <rect x="16" y="54" width="96" height="14" rx="7" fill="#CBD5E1"/>
  <rect x="26" y="58" width="76" height="6" rx="3" fill="#0B1220"/>
  <rect class="seam" x="26" y="58" width="76" height="6" rx="3" fill="#A5F3FC" opacity="0"/>
</svg>
